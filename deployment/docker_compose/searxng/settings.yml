use_default_settings:
  engines:
    # The upstream defaults enable ~60 general engines. Every /search fans out
    # to all of them, and with outgoing.using_browser each request competes for
    # the Chromium pool — dozens of doomed regional/blocked engines stretched
    # searches and timed out Onyx's client. Keep only engines that actually
    # return results from this network (verified live):
    # - google / brave: hard bot-walls, pass via the human-input fallback
    # - bing / duckduckgo: work outright
    # - wikipedia: summary/infobox results
    # - yahoo: disabled 2026-09-25, search.yahoo.com answers HTTP 500 to every
    #   query (upstream endpoint breakage, zero results since the rebuild)
    # - wikipedia: summary/infobox results
    # qwant (JSON API 403s datacenter IPs, no UI to drive), fireball (403s on
    # its settings POST before any search) and privacywall (serves an empty
    # geo shell) cannot work from this network and stay out; google-cse needs
    # Programmable Search credentials, wikidata only feeds the infobox.
    keep_only:
      # general
      - google
      - bing
      - duckduckgo
      - brave
      - wikipedia
      # images (Onyx interleaves image results into web search answers)
      - bing images
      - duckduckgo images
      - google images
server:
  # Instance secret comes from the SEARXNG_SECRET environment variable
  # (docker-compose.override.yml interpolates it from the gitignored .env).
  # Private instance: the limiter blocks API-style requests like Onyx's.
  limiter: false
search:
  formats:
    - html
    # Required by Onyx; requests use format=json.
    - json
  # Per-jar flags make engine-wide suspensions counterproductive: one
  # lane's jar eating a hard /sorry would otherwise bench every lane --
  # including jars holding a banked challenge clearance -- for a day.
  # A short cooldown lets the next request ride another jar and gives the
  # flagged jar rest instead.
  suspended_times:
    SearxEngineCaptcha: 300
    SearxEngineAccessDenied: 300
    SearxEngineTooManyRequests: 300
# General debug logging (httpx wire lines, huge engine URLs). Off for duty;
# the per-component trace switch below is the fine-grained knob.
general:
  debug: false
# Browser fetch pool: engine requests go through a masqueraded Chromium
# (see searx/network/browser.py in the fork). Needs engine timeouts high
# enough for browser-speed fetches, including challenge warm-up renders,
# per-provider pacing waits and the human-input fallback.
outgoing:
  using_browser: true
  # Which browser the fleet masquerades as: "firefox" (default) or
  # "chromium". Must agree with the image's SEARXNG_BROWSER_KIND
  # (docker-compose.override.yml builds one image per kind); if the
  # configured binary is missing the pool falls back to the other distro
  # browser with a warning. Each kind rides its own lane-profile volume
  # (browser profiles are not interchangeable).
  browser_kind: firefox
  # Each lane runs its own browser on its own Xvfb display (one pointer
  # per lane), so parallel human sessions cannot steal each other's
  # clicks. 6 lanes = 6 browser processes: keep an eye on container RAM.
  browser_pool_size: 6
  # One persistent Chromium profile per lane, on the searxng-browser-lanes
  # docker volume: cookies, storage and earned captcha clearances survive
  # container recreations, and lanes stay fully isolated from each other.
  # Wipe the volume to reset every lane's identity.
  browser_profile_dir: /var/lib/searxng/lanes
  # Ceiling (ms) on the network-idle wait before crawl DOM capture.
  # networkidle returns early when the network goes quiet; lazily hydrated
  # embeds (Wikipedia's audio player mounts after networkidle) need the
  # ceiling, not the early exit. Crawls also get a scroll down-and-back
  # cycle before capture to trigger viewport-gated embeds.
  browser_crawl_settle_ms: 12000
  # On a persistent bot challenge, drive the provider's search UI with real
  # X input (Bezier mouse with jitter, typing, a natural search-button
  # click) instead of giving up (searx/network/human_input.py).
  browser_human_fallback: true
  # Maximum stealth mode: drive the provider's search UI like a human for
  # EVERY supported request up front, not only as a challenge fallback.
  # Much slower per search (interactive typing/clicking), but the provider
  # only ever sees visits from the cookie-trained desktop browser.
  browser_max_stealth: true
  # Post-search reputation browsing: after a browser-served search returns,
  # a background task keeps that lane behaving like a reader -- it clicks
  # 1-4 random organic results (real X input), scrolls and drifts the
  # pointer over each for 10-30s, and returns to the results page. Engines
  # score each lane's persistent cookie jar by this follow-through
  # behavior; a jar that only ever searches looks like a bot. Skipped
  # automatically when no other lane is idle, so searches never starve.
  browser_post_search_browsing: true
  # Diagnostic tracing (DOM captures, typed-value logs, solver dumps to
  # /tmp/captcha_debug). Off for duty; flip on (and create the dump dir)
  # while debugging the browser flow. The /crawl response then also carries
  # a per-lane memory snapshot for affinity diagnostics.
  # (Was on for the 2026-09-30 Firefox-fleet experiment; solver evidence
  # saved to the host. To re-enable: set true and
  # docker exec -u root onyx-searxng-1 mkdir -p /tmp/captcha_debug
  # && docker exec -u root onyx-searxng-1 chown searxng:searxng
  #   /tmp/captcha_debug -- /tmp is ephemeral, create AFTER a restart.)
  browser_debug_trace: true
  # Page crawling endpoint (/crawl): lets Onyx's fetchers drive these same
  # masqueraded lanes for page fetches, so search and crawl traffic comes
  # from one fleet of cookie-trained identities.
  browser_crawl_endpoint: true
  # Shared endpoint secret: when set, EVERY route but /healthz requires it
  # (X-Crawl-Secret header or basic auth -- webapp.require_endpoint_secret
  # in the fork). This is what makes the LAN publish safe: without it the
  # 8080 port would be an open search-and-crawl proxy burning the fleet's
  # cookie reputation for the whole network. The value arrives via the
  # BROWSER_CRAWL_SECRET container env (docker-compose.override.yml
  # interpolates it from the gitignored .env); this file is git-tracked
  # and must not hold the secret. Onyx sends it embedded in the searxng
  # provider URL and SEARXNG_CRAWL_ENDPOINT (userinfo -> basic auth).
  browser_crawl_secret: ''
  # Body cap for binary crawls; matches Onyx's BINARY_DOWNLOAD_MAX_SIZE_BYTES
  # (the body is buffered in this container's RAM: 6g limit, 6 lanes).
  browser_crawl_max_bytes: 524288000
  # Vision-assisted image-grid CAPTCHA solving (searx/network/captcha_vision.py,
  # a self-contained capability of the searxng fork -- nothing in Onyx knows
  # about it). When a challenge escalates to an image grid, the screenshot and
  # its instruction go to any vision-capable model behind a standard
  # OpenAI-compatible endpoint; the answer is clicked by the human input
  # layer. The vision call is observation only; clicks stay real X input.
  captcha_vision:
    enabled: true
    endpoint: 'http://172.29.153.35:8011'
    # Bearer token arrives via the CAPTCHA_VISION_API_KEY container env
    # (docker-compose.override.yml interpolates it from the gitignored .env);
    # this file is git-tracked and must not hold the secret.
    api_key: ''
    model: 'Qwen3.6-35B-A3B-UD-Q4_K_XL.gguf'
    # 0 = no num_ctx hint is sent and the backend serves with its own default
    # context ("auto"). The literal string "auto" would crash the int() parse
    # in captcha_vision.py.
    context_size: 0
    timeout: 360
    # SSE streaming: deltas keep flowing during long generations and the
    # transport assembles them transparently (llama.cpp and Ollama both
    # speak OpenAI-shaped SSE; thinking rides reasoning_content resp.
    # reasoning and is only used when content comes back empty).
    stream: true
    max_rounds: 12
    # Wall-clock cap for one whole solve attempt (all rounds and votes).
    # Bounds how long a lane can be held by a challenge that never clears:
    # ~2x the slowest solve observed to succeed (~12min).
    session_budget: 1500
    # 1 sample per round: the first answer decides, no inverted
    # cross-check, no quorum. The 2026-10-19 smoke test was 3/3 unanimous
    # on Qwen3.6-35B, and a round now costs ~30s instead of ~2min -- the
    # search request may still time out while the lane keeps solving, but
    # the lane keeps the clearance cookies once it succeeds. Revert to 3
    # (2 direct + 1 inverted, quorum 2) if the model starts flickering on
    # tiles between rounds.
    votes: 1
  # Global per-provider send pacing (searx/network/pacing.py): requests to
  # the same upstream host are spaced a random 1-5s apart, whatever engine
  # or search sent them; different providers never block each other. max_wait
  # bounds the queue so a burst drains instead of piling up forever. This
  # layer governs searxng's own HTTP sends; browser-lane traffic (the
  # max-stealth searches and /crawl requests) is paced by the origin gate
  # below instead.
  pacing:
    enabled: true
    delay_min_seconds: 1.0
    delay_max_seconds: 5.0
    max_wait_seconds: 20.0
  # Per-origin human pacing for browser-lane traffic
  # (searx/network/browser.py): successive requests to the SAME site keep a
  # minimum jittered gap even across lanes, as if one attentive person were
  # doing the research; different origins stay parallel. [min, max] seconds;
  # a burst waits at most 45s per request before it goes.
  browser_origin_gap_search: [4, 10]
  browser_origin_gap_site: [8, 20]

  # Persistent SERP cache: a /search request whose canonical identity
  # (query, locale, pageno, safesearch, time_range, engine set) matches a
  # fresh entry is answered from disk without touching any browser lane.
  # Bodies are zstd-compressed JSON envelopes with per-engine result
  # blocks. TTL is fixed on write and never extended by reads.
  search_cache:
    enabled: true
    ttl_seconds: 86400
    path: /var/cache/searxng/serp_cache.sqlite3
    compression_level: 3
    prune_interval_writes: 50
  request_timeout: 60.0
# Engine overrides merge by name with the defaults. google / bing / brave are
# disabled in the upstream defaults; the rest stay enabled.
# Timeouts: the budget covers the origin pacing gap (4-10s, bursts more), the
# bounded lane wait (usually seconds; browsing preemption at 20s), lane cold
# starts after an idle reap (Chromium relaunch), and browser-speed fetches
# including challenge solving. A chat turn fans a query burst out over the
# same 6 lanes, so per-origin queueing eats into these budgets -- 2026-09-30
# (Prachuap session postmortem): 60-85s budgets expired mid-burst, every
# engine returned "timeout", and Onyx's retries piled onto the congestion.
# The raised budgets ride out a burst; Onyx's client read timeout
# (SEARXNG_READ_TIMEOUT_SECONDS, 450s) stays far above all of them, and its
# retries land 20s/40s later, paced like a person re-querying, by which time
# a banked clearance often lets the search through.
engines:
  # 2026-09-26 (evening): live-tested again on this residential IP. The
  # lane identity is now fully self-consistent (real distro Chromium, no
  # UA persona lies, TTL 64 at the VM egress, IP-derived Thai locale,
  # webdriver suppressed) and the solver handles dynamic grids (growth
  # detection, inverted quorum votes, 12 slides). Google still rejects
  # defensible answers and collapses the challenge; the remaining deltas
  # vs a normal desktop are the Chromium-vs-Chrome binary brand, the
  # young cookie jars, and this IP's google-side history from our own
  # earlier automated attempts. Left ENABLED per owner decision: a google
  # search costs up to 100s (client budget) while the lane keeps solving
  # in the background (12 slides x 6 votes, minutes per challenge).
  # Disable here if that latency is not acceptable; the solver itself is
  # harmless for engines that never challenge.
  - name: google
    # RE-ENABLED 2026-10-19: (a) the jars have had 18 days of rest (the
    # 2026-10-01 hard-flag verdict gets its re-test); (b) the Playwright
    # BiDi console-entry driver crash google pages kept triggering is
    # fixed in the fork (container/patch-bidi-console.py, commit 4187d25).
    # If the homepage lands on /sorry straight away again, the lane keeps
    # solving in the background (12 slides x 1 vote) and banks the
    # clearance for later requests -- watch the logs and re-disable if
    # every attempt still burns the 100s budget without ever navigating.
    disabled: false
    # Normal search returns in ~20-40s on a warm lane. If google challenges
    # the lane, the request fails at this budget while the lane keeps
    # solving in the background and earns clearance for later requests
    # (Onyx's client read timeout is 450s; the budget must stay below it).
    timeout: 100.0
  - name: google images
    # re-enabled together with google (see above). 2026-10-20: switched from
    # the discontinued WML image endpoint (zero results since google pulled
    # the layout) to the desktop image grid -- same masqueraded human flow
    # as google web, starting from /imghp so the typed query lands in the
    # images vertical; challenge clears along the way are the solver's.
    # A challenged image search waits on the same reCAPTCHA flow as google
    # web: give it the same budget instead of the 60s default.
    disabled: false
    timeout: 100.0
  - name: bing
    disabled: false
    # 2x the worst warm-lane search observed (~35s incl. render + settle),
    # plus headroom for burst queueing behind the per-origin gap.
    timeout: 90.0
  - name: brave
    disabled: false
    # 2x the worst warm-lane search observed (~35s incl. render + settle),
    # plus headroom for burst queueing behind the per-origin gap.
    timeout: 90.0
  # duckduckgo / wikipedia have no engine-specific override upstream: they
  # inherit outgoing.request_timeout (60s), which a burst can eat entirely.
  # Give them the same burst headroom as the other browser-served engines.
  - name: duckduckgo
    timeout: 90.0
  - name: wikipedia
    timeout: 90.0
