# Local additions merged on top of docker-compose.yml automatically.
services:
  searxng:
    # Fork with the masqueraded Chromium fetch pool (outgoing.using_browser),
    # global per-provider send pacing and the human-like input fallback.
    # Engine requests go through a real, fingerprint-masqueraded browser:
    # no more CAPTCHA walls, wrong-query junk pages or Thai geo-mangling.
    # Onyx connects DIRECTLY to this service (searxng_base_url in the web
    # search provider settings points at http://searxng:8080): pacing now
    # lives inside the fork, so the old searxng-pacer proxy is gone.
    image: searxng-browser:dev
    build:
      # build straight from the fork, no local checkout needed
      context: https://github.com/plartemyev/searxng.git#feat/browser-masquerade
      dockerfile: container/browser.dockerfile
    # Same command as the image ENTRYPOINT plus granian's backpressure cap:
    # with ~7 engines per search, a 16-search Onyx burst used to spawn 100+
    # WSGI threads that all queued on the 6 browser lanes and timed out
    # together. Backpressure bounds in-flight requests (≈4 searches' worth of
    # engine fetches); the rest queue at the HTTP layer within Onyx's 450s
    # client read timeout (SEARXNG_READ_TIMEOUT_SECONDS=450, set below for
    # api_server and background) instead of piling onto the lanes.
    entrypoint:
      - granian
      - --interface
      - wsgi
      - --host
      - "::"
      - --port
      - "8080"
      - --backpressure
      - "28"
      - searx.webapp:app
    restart: unless-stopped
    # The persona is a Linux desktop Chromium, but the docker NAT forwards
    # packets one hop below this container: the kernel default TTL 64 leaves
    # the VM as 63, telling google "automated guest behind another machine".
    # 65 here arrives as exactly 64, the TTL of any Linux client on this LAN.
    sysctls:
      - net.ipv4.ip_default_ttl=65
    # Cap blast radius: a browser-pool leak must not starve the host.
    # Measured peak under a research session: memory.peak 7.03G with
    # oom_kill 38 (2026-09-27 13:00-14:30): the OOM killer took the shared
    # playwright driver first, and every lane then failed until the pool
    # was restarted. The old 6g cap sat below this demand.
    # 8g fits the peak with headroom; memswap_limit bounds total pressure
    # before the kill.
    mem_limit: 8g
    memswap_limit: 10g
    # PID 1 (granian) does not reap children: OOM-killed chromium processes
    # pile up as zombies (148 after the 2026-09-27 OOM storm) until the PID
    # space runs out. tini reaps them.
    init: true
    healthcheck:
      # No wget/curl in this image; python3 ships with searxng.
      test:
        - CMD
        - python3
        - -c
        - import urllib.request; urllib.request.urlopen("http://localhost:8080/healthz", timeout=4)
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 45s
    environment:
      - SEARXNG_BASE_URL=http://searxng:8080/
      # instance secret, from the gitignored .env (see settings.yml)
      - SEARXNG_SECRET=${SEARXNG_SECRET}
      # Operational INFO lines (pool up, human search flow, crawl routing)
      # stay visible in production mode; DEBUG wire noise stays off.
      - SEARXNG_LOG_LEVEL=INFO
    volumes:
      - ./searxng:/etc/searxng:ro
      # Named volume so the geo-locale cache (/var/cache/searxng/
      # ip_locale.json) survives container recreations: restarts then reuse
      # the resolved identity instead of re-querying the geoip services.
      - searxng-cache:/var/cache/searxng
      # Persistent per-lane Chromium cookie jars (outgoing.browser_profile_dir
      # in searxng/settings.yml): one profile per lane, fully isolated, so
      # earned clearances and engine cookies survive container recreations.
      - searxng-browser-lanes:/var/lib/searxng/lanes

  # Deep Research / long-run chat tuning for slow local inference (48h budget).
  # Merged into the api_server service from docker-compose.yml by compose.
  api_server:
    environment:
      # Orchestrator cycles: high enough that time is the only binding limit
      - DR_MAX_ORCHESTRATOR_CYCLES=1000
      - DR_MAX_ORCHESTRATOR_CYCLES_REASONING=500
      # The orchestrator fans out one research_agent call per entity in a
      # single turn; the harness queues them and runs at most one at a time
      # (serial same-origin traffic, small local model, one GPU server).
      - DR_MAX_PARALLEL_SUBAGENTS=1
      # Fallback for thinking-capable local models the capability registry
      # cannot classify. Primary source is the engine itself: Ollama's
      # /api/show reports per-model capabilities (cached in-process).
      - DR_THINKING_MODEL_OVERRIDES=ornith-1.5:9b
      # Keep the stream buffer replayable across disconnects for the whole run (48h)
      - CHAT_STREAM_BUFFER_TTL_S=172800
      # Slow inference: allow long gaps between streamed chunks
      - DR_REPORT_LLM_TIMEOUT_S=1200
      - LLM_SOCKET_READ_TIMEOUT=1200
      # Regular chat agentic loop: 6 -> 12 tool-call cycles before forced answer
      - MAX_LLM_CYCLES=12
      # Small local models: the serving layer (Ollama) tokenizes the prompt
      # itself, and its count (chat template + tokenizer drift on tool
      # output) runs a few percent above Onyx's cl100k estimate. A wider
      # margin keeps packed prompts under the server's limit; the loop also
      # retries with a shrunken history when the server still rejects one.
      - GEN_AI_INPUT_TOKEN_SAFETY_MARGIN=0.10
      # In-turn compaction stubs replay a digest of the removed tool
      # response (deterministic; tier 1). Tier 2 summarizes large responses
      # with the chat model so the model keeps findings (thread titles, URLs,
      # numbers) instead of re-running identical calls — the failure mode
      # that turned the 2026-09-30 Prachuap session into a 40-minute turn.
      # Falls back to the tier-1 digest on timeout/error.
      - GEN_AI_TOOL_RESPONSE_SUMMARIZATION=true
      # 120s: big page fetches (tens of KB) need far more prompt-processing
      # time on the local model than the 30s default allows; matches the
      # deployment's LLM_SOCKET_READ_TIMEOUT. On timeout the digest call is
      # abandoned and the deterministic tier-1 digest is used.
      - GEN_AI_TOOL_RESPONSE_SUMMARIZATION_TIMEOUT_SECONDS=120
      # Load the Ollama model with num_ctx above Onyx's max input tokens so
      # template overhead and generation never push the prompt over context.
      - OLLAMA_NUM_CTX_HEADROOM=8192
      # DR per-phase temperature experiment dropped: with engine-reported
      # thinking capability, ornith counts as a reasoning model and multi_llm
      # pins reasoning-model temperature to 1 (stock Onyx semantics); the
      # DR_TEMPERATURE_* envs stay available in code for non-reasoning models.
      # Bound how large a research sub-agent's prompt may grow (search
      # results accumulate cycle over cycle). Keeps each sub-agent cycle a
      # bounded prefill instead of creeping toward the full context window.
      - DR_SUBAGENT_CONTEXT_TOKENS=24000
      # Sub-agent reports feed the orchestrator, not people. With the
      # task-proportional concision directive in the sub-agent report prompt,
      # narrow per-entity tasks produce short dense reports; 800 tokens is a
      # hard ceiling (~1.5 minutes of generation on this GPU) and keeps a
      # 20-entity fan-out far inside the orchestrator's context.
      - DR_MAX_INTERMEDIATE_REPORT_TOKENS=800
      # 25 -> 50 retrieved chunks fed to the LLM per search
      - MAX_CHUNKS_FED_TO_CHAT=50
      # Tool-calling reimplementation evaluation: dump full request history,
      # accumulated reasoning/answer and tool calls to onyx_debug.log per step.
      # Read at import time — applies on the next api_server restart; turn off
      # (and restart) once evaluation is done, it logs full prompts.
      - LOG_ONYX_MODEL_INTERACTIONS=true
      # Persistent-session code interpreter (research sandbox). The per-call
      # exec budget must stay BELOW the code-interpreter service's cap
      # (MAX_EXEC_TIMEOUT_MS below) and BELOW TOOL_EXECUTION_TIMEOUT_SECONDS,
      # so the executor's structured timed_out result reaches the model.
      - CODE_INTERPRETER_SESSIONS_ENABLED=true
      - CODE_INTERPRETER_SESSION_TTL_SECONDS=1800
      - CODE_INTERPRETER_DEFAULT_TIMEOUT_MS=180000
      - CODE_INTERPRETER_MAX_STAGED_FILES=100
      - CODE_INTERPRETER_MAX_STAGED_BYTES=524288000
      - CODE_INTERPRETER_MAX_GENERATED_ARTIFACTS=100
      # One tool call (batch) budget. Must stay above the per-exec budget
      # above, and above the slowest legitimate search/crawl chain: a
      # challenge-hit search may retry twice at human pace (<= ~6 min), a
      # retried crawl or download <= ~9.5 min; 1200s = 2x that, so a slow
      # but delivering tool call is never tombstoned as "lost".
      - TOOL_EXECUTION_TIMEOUT_SECONDS=1200
      # Whole-turn wall clock: forces the final answer instead of an unbounded
      # crawl when downloads/tool calls stall. 2x the batch budget so a turn
      # can still hold two slow batches plus local inference time.
      - CHAT_TURN_BUDGET_SECONDS=3600
      # Deep Research wall clocks, retuned for the paced search/crawl chains
      # (tools run sequentially inside research agents). The overall budget is
      # deliberately generous (48h): slow is acceptable, undelivered reports
      # are not — serial fan-outs of this scale and beyond must complete.
      # Ordering matters: agent force-report < agent timeout < overall
      # force-report, and all above TOOL_EXECUTION_TIMEOUT_SECONDS.
      - DR_FORCE_REPORT_S=172800
      - DR_RESEARCH_AGENT_TIMEOUT_S=2700
      - DR_RESEARCH_AGENT_FORCE_REPORT_S=1800
      # download_file cap: the old 50 MB default rejected JDK-sized archives
      # that the sandbox itself downloads fine. Bodies stream to a disk spool.
      - BINARY_DOWNLOAD_MAX_SIZE_BYTES=524288000
      # The Arch research executor bundles PlantUML (+ JDK); the run_python
      # guidance then tells the model to validate and render .puml diagrams
      # locally instead of trying to install something.
      - PYTHON_SANDBOX_PLANTUML=true
      # Page crawling goes through the SearXNG /crawl endpoint: its
      # masqueraded browser pool serves search AND crawl traffic, so every
      # visit comes from the same cookie-trained identities. With this set,
      # the local Chromium pool stays cold (config remains available as a
      # fallback by unsetting this var).
      # The egress IP is Thai: the local browser's clock must agree with it
      # (matters for the web connector, which still drives a local browser).
      - SEARXNG_CRAWL_ENDPOINT=http://searxng:8080/crawl
      # 2x the SearXNG-side worst case per call (timeout_s + 150s) so a
      # slow crawl is never cut off mid-flight by this client.
      - SEARXNG_CRAWL_TIMEOUT_SECONDS=540
      # Search chain budget: engine timeout + pacing gap + bounded lane
      # wait, 2x worst attempt; retries are paced 20s/40s.
      - SEARXNG_READ_TIMEOUT_SECONDS=450
      # Match the download cap below so large files are cut by the tool's
      # cap, not the proxy's.
      - SEARXNG_CRAWL_MAX_BYTES=524288000
      - WEB_BROWSER_TIMEZONE=Asia/Bangkok

  # Background workers also make LLM calls (scheduled Craft runs, doc
  # processing). Match api_server's slow-inference tolerance plus the
  # code-interpreter session settings used by scheduled chat runs.
  background:
    environment:
      - LLM_SOCKET_READ_TIMEOUT=1200
      # Craft/scheduled chat runs in workers use the same loop + retrieval caps
      - MAX_LLM_CYCLES=22
      - GEN_AI_INPUT_TOKEN_SAFETY_MARGIN=0.10
      - OLLAMA_NUM_CTX_HEADROOM=8192
      # DR temperature experiment dropped (see api_server block); sub-agent
      # caps remain.
      - DR_SUBAGENT_CONTEXT_TOKENS=24000
      - DR_MAX_INTERMEDIATE_REPORT_TOKENS=2500
      - MAX_CHUNKS_FED_TO_CHAT=50
      - CODE_INTERPRETER_SESSIONS_ENABLED=true
      - CODE_INTERPRETER_SESSION_TTL_SECONDS=1800
      - CODE_INTERPRETER_DEFAULT_TIMEOUT_MS=180000
      - CODE_INTERPRETER_MAX_STAGED_FILES=100
      - CODE_INTERPRETER_MAX_STAGED_BYTES=524288000
      - CODE_INTERPRETER_MAX_GENERATED_ARTIFACTS=100
      # One tool call (batch) budget; must stay above the per-exec budget above
      # and above the slowest legitimate search/crawl chain (see api_server).
      - TOOL_EXECUTION_TIMEOUT_SECONDS=1200
      # Whole-turn wall clock (see api_server above).
      - CHAT_TURN_BUDGET_SECONDS=3600
      # Deep Research wall clocks (see api_server above) for scheduled runs.
      - DR_FORCE_REPORT_S=172800
      - DR_RESEARCH_AGENT_TIMEOUT_S=2700
      - DR_RESEARCH_AGENT_FORCE_REPORT_S=1800
      # Report-step read timeout (see api_server) for scheduled runs.
      - DR_REPORT_LLM_TIMEOUT_S=1200
      # The Arch research executor bundles PlantUML; mention it in run_python
      # guidance (api_server below and here for scheduled chat runs).
      - PYTHON_SANDBOX_PLANTUML=true
      # Page crawling through the SearXNG /crawl endpoint (see api_server
      # above): the web connector's page fetches and any tool crawls here
      # ride the same masqueraded browser fleet as the searches.
      - SEARXNG_CRAWL_ENDPOINT=http://searxng:8080/crawl
      # 2x the SearXNG-side worst case per call (see api_server above).
      - SEARXNG_CRAWL_TIMEOUT_SECONDS=540
      # Search chain budget (see api_server above).
      - SEARXNG_READ_TIMEOUT_SECONDS=450
      - SEARXNG_CRAWL_MAX_BYTES=524288000
      - WEB_BROWSER_TIMEZONE=Asia/Bangkok

  # Persistent-session code interpreter: forked service (0.5.0) built from this
  # repo plus an Arch-based research executor image (pip/uv/poetry, ffmpeg,
  # librosa). Limits tuned for multi-step download-and-analyze research.
  code-interpreter:
    build:
      context: ../../code-interpreter/service
    image: code-interpreter:0.5.0-fork
    # Host-published for external-dependency tests and manual debugging.
    ports:
      - "127.0.0.1:18000:8000"
    environment:
      # Per-execution caps (user-tuned): 10 min wall clock, 20 min CPU budget,
      # 4 GB RAM, 500 MB uploads.
      - MAX_EXEC_TIMEOUT_MS=600000
      - CPU_TIME_LIMIT_SEC=1200
      - MEMORY_LIMIT_MB=4000
      - MAX_FILE_SIZE_MB=500
      - PYTHON_EXECUTOR_DOCKER_IMAGE=code-interpreter-executor:arch-20260920
      # Session hard-lifetime cap; per-session TTL comes from the api side.
      - SESSION_MAX_LIFETIME_SEC=86400

  # Host-published for external-dependency tests (Onyx file store).
  minio:
    ports:
      - "127.0.0.1:19000:9000"

  # Host-published for external-dependency tests (session mapping store).
  cache:
    ports:
      - "127.0.0.1:16379:6379"

volumes:
  # Holds /var/cache/searxng for the searxng service (geo-locale cache).
  searxng-cache:
  # Holds /var/lib/searxng/lanes for the searxng service: one persistent
  # Chromium profile per browser lane (cookies, storage, clearances).
  searxng-browser-lanes:
